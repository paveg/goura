run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - goimports
    - gosec
    - revive
  disable:
    - unused

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
